name: Check API

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: build docker
      run: docker build -t golang-app .

    - name: run container
      run: docker run --name golang-test -p 80:8000 golang-app

    - name: run tests
      uses: liatrio/github-actions/apprentice-action@master

